apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-monitor
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-monitor
  template:
    metadata:
      labels:
        app: mc-monitor
    spec:
      containers:
        - name: mc-monitor
          image: itzg/mc-monitor:1.18.3
          args:
            - export-for-prometheus
            - --timeout
            - 5s
          env:
            - name: EXPORT_SERVERS
              value: minecraft.minecraft.svc.cluster.local:25565
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mc-monitor
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: mc-monitor
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics